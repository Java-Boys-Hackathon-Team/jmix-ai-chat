services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: jmixaichat-db
    environment:
      POSTGRES_DB: jmixaichat
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgadmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
